<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle">
        <input type="checkbox" id="theme-toggle" />
        <span id="theme-toggle-label">MODO CLARO</span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <div id="view-gameover" class="overlay-view">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <button id="restart-btn">Reiniciar</button>
        </div>

        <div id="view-pause" class="overlay-view hidden">
          <p class="overlay-heading">PAUSA</p>
          <div class="pause-actions">
            <button id="resume-btn">Reanudar</button>
            <button id="pause-restart-btn">Reiniciar</button>
            <button id="controls-toggle-btn" class="secondary">Ver controles</button>
          </div>
          <div class="level-select">
            <span class="label">NIVEL INICIAL (próxima partida)</span>
            <div class="level-options" id="level-options"></div>
          </div>
        </div>

        <div id="view-controls" class="overlay-view hidden">
          <p class="overlay-heading">CONTROLES</p>
          <ul class="overlay-controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> caída suave</li>
            <li><kbd>Space</kbd> caída rápida</li>
            <li><kbd>P</kbd> <kbd>Esc</kbd> pausa</li>
          </ul>
          <button id="controls-back-btn" class="secondary">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
