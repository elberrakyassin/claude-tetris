<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle">
        <input type="checkbox" id="theme-toggle" />
        <span id="theme-toggle-label">MODO CLARO</span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="overlay-endgame-extra" class="hidden">
          <p id="overlay-run-stats" class="global-stats"></p>

          <form id="name-entry-form" class="name-entry hidden">
            <p class="name-entry-msg">¡Nuevo récord! Ingresá tu nombre:</p>
            <input id="player-name-input" type="text" maxlength="15" placeholder="Jugador" autocomplete="off" />
            <button type="submit" class="primary-btn">Guardar</button>
          </form>

          <div class="leaderboard">
            <span class="label">TOP 5</span>
            <ol id="overlay-leaderboard-list" class="leaderboard-list"></ol>
          </div>

          <button id="reset-records-btn-overlay" class="secondary-btn">Resetear récords</button>
        </div>

        <button id="restart-btn" class="primary-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <h2 class="overlay-heading">TETRIS</h2>

        <div class="leaderboard">
          <span class="label">TOP 5</span>
          <ol id="start-leaderboard-list" class="leaderboard-list"></ol>
        </div>

        <p id="start-global-stats" class="global-stats"></p>

        <button id="play-btn" class="primary-btn">Jugar</button>
        <button id="reset-records-btn-start" class="secondary-btn">Resetear récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
